<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Claw'dbot</title>
<style>
  /* html/body must stay transparent or WebView2 paints white (plan §window) */
  html, body { margin: 0; height: 100%; background: transparent; overflow: hidden; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; }

  /* browser-demo desk backgrounds — added by script, never in Tauri */
  body.demo-dark  { background: #1e1f24; }
  body.demo-light { background: #e8e6e1; }

  #pet-wrap {
    position: fixed;
    right: 40px; bottom: 24px;
    width: 160px; height: 160px;
  }
  #pet-canvas { image-rendering: pixelated; display: block; }
  /* the treat shares the buddy's unit space: same box, same scale, laid
     straight over the pet canvas. Decorative only — never clickable. */
  #treat-canvas {
    position: absolute; left: 0; top: 0;
    image-rendering: pixelated; pointer-events: none;
  }

  /* inside the real Tauri window the pet fills it and debug hides.
     LEFT-anchored: the webview viewport under-reports the window width by
     ~12px, so a right-anchored canvas hangs its left ~12px outside the
     viewport — clipping leftmost art (the working clip's laptop) and
     skewing the window-relative hit-region by the same amount. */
  /* 110px bottom margin = the window's BUBBLE_ROOM (keep in sync with Rust).
     Horizontally CENTERED in the window: panels center on the sprite, and a
     left-anchored canvas made wide panels physically unable to align with
     the buddy. Both webview clip strips still fall on empty side padding
     (window ≥400 wide, canvas ≤280 at common scales). */
  body.tauri #pet-wrap { left: 50%; transform: translateX(-50%); bottom: 110px; right: auto; }
  body.tauri #debug { display: none; }

  #debug {
    position: fixed; top: 14px; left: 14px;
    background: rgba(20,20,24,.92); color: #ddd;
    border: 1px solid #444; border-radius: 10px;
    padding: 12px 14px; font-size: 12px;
    display: grid; gap: 8px; width: 240px;
  }
  #debug h1 { font-size: 13px; margin: 0 0 2px; color: #e89478; }
  #debug .states { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; }
  #debug button {
    background: #33343c; color: #ddd; border: 1px solid #555;
    border-radius: 6px; padding: 5px 6px; font-size: 12px; cursor: pointer;
  }
  #debug button:hover { background: #44454f; }
  #debug button.active { background: #c1694f; color: #fff; border-color: #c1694f; }
  #debug label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  #debug .row { display: flex; gap: 6px; align-items: center; justify-content: space-between; }

  /* session popover: opens above the buddy (into the window's standing
     headroom in Tauri), solid dark panel readable on any wallpaper */
  #popover {
    position: fixed; box-sizing: border-box;
    background: rgba(22, 22, 27, .96); color: #e6e0da;
    border: 1px solid #4a453f; border-radius: 12px;
    padding: 10px 12px; font-size: 12px; line-height: 1.35;
    max-height: 330px; overflow-y: auto;
    box-shadow: 0 6px 24px rgba(0,0,0,.45);
  }
  #popover .pop-head {
    font-weight: 600; color: #e89478; margin-bottom: 6px;
    display: flex; justify-content: space-between; gap: 8px;
  }
  #popover .pop-blind { color: #b9b2ab; font-style: italic; }
  /* Cowork watcher health: a second, quieter blindness line */
  #popover .pop-cowork { color: #b9b2ab; font-style: italic; font-size: 11px; margin: -2px 0 6px; }
  /* surface pill: Cowork rows carry one, Claude Code rows carry none */
  #popover .surface {
    flex: none; font-size: 9px; line-height: 1; padding: 3px 5px; border-radius: 8px;
    background: #3a3f4a; color: #c9d1dc; letter-spacing: .02em;
  }
  #popover .sess { padding: 5px 6px; margin: 0 -6px; border-top: 1px solid #33302c; cursor: pointer; border-radius: 6px; }
  #popover .sess:first-of-type { border-top: none; }
  #popover .sess:hover { background: rgba(255, 255, 255, .06); }
  body.panels-light #popover .sess:hover { background: rgba(0, 0, 0, .05); }
  #popover .sess .top { display: flex; align-items: center; gap: 6px; }
  #popover .dot { width: 8px; height: 8px; border-radius: 3px; flex: none; }
  #popover .proj { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #popover .st { color: #b9b2ab; flex: none; }
  #popover .age { color: #8a857f; margin-left: auto; flex: none; }
  /* Per-row attention control. Reserved with visibility (never display), so
     revealing it on hover cannot reflow the row — a resize under a motionless
     cursor would move the thing being aimed at and invalidate reportBounds. */
  #popover .fbtn {
    flex: none; visibility: hidden; font: inherit; font-size: 10px; line-height: 1;
    padding: 2px 5px; margin-left: 4px; border-radius: 5px; cursor: pointer;
    background: #3a3530; color: #b9b2ab; border: 1px solid #4a443d;
  }
  #popover .sess:hover .fbtn { visibility: visible; }
  #popover .fbtn:hover { background: #4a443d; color: #efe7dd; }
  /* a quiet row stays legible but plainly stood-down, and keeps its control
     visible so the state is never a mystery you have to hover to discover */
  #popover .sess.quiet { opacity: .55; }
  #popover .sess.quiet .fbtn { visibility: visible; background: #4a3a30; border-color: #6b5140; }
  body.panels-light #popover .fbtn { background: #e7e0d8; color: #6f6862; border-color: #c9beb4; }
  body.panels-light #popover .fbtn:hover { background: #d8cfc4; color: #3b3630; }
  body.panels-light #popover .sess.quiet .fbtn { background: #efdccf; border-color: #d3b49f; }
  /* the rule list: the only way back from `ignore`, whose rows are gone */
  /* the muted ask: a mark, not a message */
  #bubble.ask { padding: 4px 10px; min-width: 0; }
  #bubble .b-q { font-size: 19px; font-weight: 700; line-height: 1.1; text-align: center; opacity: .85; }
  #popover .frule { display: inline-flex; align-items: center; gap: 4px; }
  #popover .frule .x { opacity: .6; font-weight: 700; }
  #popover .frule:hover .x { opacity: 1; }
  #popover .detail {
    color: #a29c95; margin: 2px 0 0 14px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #popover .empty { color: #a29c95; padding: 4px 0; }

  /* speech bubble: passive, non-interactive callout while Claude needs the
     user (or errored) — the ask must be readable without any clicking */
  /* clickable: a click jumps to the session that needs you */
  #bubble {
    position: fixed; cursor: pointer; box-sizing: border-box;
    background: rgba(22, 22, 27, .96); color: #e6e0da;
    border: 1px solid #e89478; border-radius: 12px;
    padding: 10px 14px; font-size: 14px; line-height: 1.35;
    max-width: 320px;
    box-shadow: 0 4px 18px rgba(0,0,0,.4);
  }
  #bubble:hover { border-color: #ffb08a; }
  #bubble.err { border-color: #7d7d92; }
  #bubble.err:hover { border-color: #a9a9c0; }
  #bubble .b-title { font-weight: 600; color: #e89478; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #bubble.err .b-title { color: #a9a9c0; }
  /* the ask grows as long as it needs to — the bubble opens UPWARD into the
     window's reserved popover headroom, so there is room. max-height is only
     a sanity stop so a pathological stack trace can't outgrow that headroom. */
  #bubble .b-detail {
    color: #b9b2ab;
    max-height: 300px; overflow: hidden;
    word-break: break-word;
  }
  /* tail points DOWN at his head: the bubble sits above him (see updateBubble) */
  #bubble .b-tail {
    position: absolute; bottom: -6px; left: 50%; margin-left: -6px;
    width: 0; height: 0;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 6px solid #e89478;
  }
  #bubble.err .b-tail { border-top-color: #7d7d92; }

  /* shared circular button family: the "+" and the gear are siblings */
  .round-btn {
    display: flex; align-items: center; justify-content: center;
    box-sizing: border-box; padding: 0; font: inherit;
    position: relative; /* anchors the invisible hit ring */
    background: rgba(22, 22, 27, .96); color: #e89478;
    border: 1px solid #e89478; border-radius: 50%;
    cursor: pointer; user-select: none;
  }
  /* invisible hit rings: a button's pseudo-element is part of its click
     target — the FORGIVING area extends well past the visible circle */
  #gearbtn::before, #newbtn::before, #treatbtn::before {
    content: ''; position: absolute; inset: -8px; border-radius: 50%;
  }
  .round-btn:hover { background: #c1694f; color: #fff3ea; }
  /* CRITICAL: display:flex on .round-btn overrides the UA's [hidden] rule
     (author styles always beat UA styles) — without this the "+" is
     permanently visible, parked unpositioned at the window's top-left */
  .round-btn[hidden] { display: none; }
  /* hover buttons: the "+" (a new Claude Code session) and the treat, as a
     tiny pair centered right below the buddy. They show and hide together
     and both yield to the speech bubble. ONE positioned element — the row —
     so placeCenteredOnBuddy() stays the only centering rule. */
  #petbtns { position: fixed; display: flex; gap: 6px; align-items: center; }
  #petbtns[hidden] { display: none; } /* flex would override [hidden] */
  #newbtn, #treatbtn {
    width: 18px; height: 18px;
    font-size: 13px; line-height: 1;
    box-shadow: 0 2px 8px rgba(0,0,0,.4);
  }
  #newbtn.clicked { background: #c1694f; color: #fff3ea; }
  /* the treat glyph is drawn as PIXELS (integer-grid rects in currentColor,
     chips punched out with evenodd so the button shows through) — never an
     emoji, which would render oversized and spill out of the hit circle */
  #treatbtn svg { display: block; }
  /* peckish: hours since the last treat, so the button breathes when it
     appears. Opacity only — no colour alarm, no JS timer, and it stops the
     moment he is fed. */
  @keyframes treat-peckish {
    0%, 100% { opacity: 1; }
    50%      { opacity: .5; }
  }
  #treatbtn.peckish { animation: treat-peckish 2s ease-in-out infinite; }
  /* popover gear: a real button — the visible circle IS the hit area. The
     glyph is forced to TEXT presentation ('Segoe UI Symbol' + VS15 in JS):
     emoji-style ⚙ renders bigger than the button and spills outside the
     clickable circle, making the icon feel only partially selectable. */
  /* NOTE: no overflow:hidden here — it would clip the ::before hit ring.
     Emoji-size spill is prevented by the VS15 glyph + Segoe UI Symbol. */
  #popover .gear {
    width: 28px; height: 28px; font-size: 15px;
    font-family: 'Segoe UI Symbol', 'Segoe UI', sans-serif;
    margin-left: auto; flex: none;
  }
  #popover .theme-row { display: flex; flex-wrap: wrap; gap: 5px; margin: 2px 0 8px; align-items: center; }
  #popover .theme-row[hidden] { display: none; } /* flex would override [hidden] */
  #popover .tone-grp { display: flex; gap: 5px; align-items: center; }
  #popover .theme-row .lbl { color: #8a857f; font-size: 11px; margin-right: 2px; }
  #popover .theme-row button {
    background: #33343c; color: #ddd; border: 1px solid #555;
    border-radius: 6px; padding: 2px 8px; font-size: 11px; cursor: pointer;
  }
  #popover .theme-row button.active { background: #c1694f; border-color: #c1694f; color: #fff; }

  /* light theme for the panels (popover + bubble + plus button) */
  body.panels-light #popover, body.panels-light #bubble {
    background: rgba(247, 244, 240, .97); color: #3b3630; border-color: #c9beb4;
  }
  body.panels-light .round-btn {
    background: rgba(247, 244, 240, .97); color: #b05a3f; border-color: #c1694f;
  }
  body.panels-light .round-btn:hover { background: #c1694f; color: #fff3ea; }
  body.panels-light #popover .pop-head { color: #b05a3f; }
  body.panels-light #popover .sess { border-top-color: #e3dcd4; }
  body.panels-light #popover .st { color: #6f6862; }
  body.panels-light #popover .age { color: #8a8378; }
  body.panels-light #popover .detail, body.panels-light #popover .empty { color: #6f6862; }
  body.panels-light #popover .pop-blind { color: #8a8378; }
  body.panels-light #popover .pop-cowork { color: #8a8378; }
  body.panels-light #popover .surface { background: #dfe3ea; color: #4a5260; }
  body.panels-light #popover .theme-row button { background: #e7e0d8; color: #3b3630; border-color: #c9beb4; }
  body.panels-light #popover .theme-row button.active { background: #c1694f; border-color: #c1694f; color: #fff; }
  body.panels-light #bubble { border-color: #c1694f; }
  body.panels-light #bubble .b-title { color: #b05a3f; }
  body.panels-light #bubble.err { border-color: #8a8a9a; }
  body.panels-light #bubble.err .b-title { color: #6d6d84; }
  body.panels-light #bubble .b-detail { color: #6f6862; }
  body.panels-light #bubble .b-tail { border-top-color: #c1694f; }
  body.panels-light #bubble.err .b-tail { border-top-color: #8a8a9a; }
</style>
</head>
<body>

<div id="pet-wrap">
  <canvas id="pet-canvas"></canvas>
</div>

<!-- static skeleton: the gear and theme row are built ONCE and never
     replaced — a rebuilt button under a motionless cursor loses its hover
     state and eats clicks. Only #pop-sessions contents get re-rendered. -->
<div id="popover" hidden>
  <div class="pop-head">
    <span id="pop-count"></span>
    <span id="pop-blind" class="pop-blind" hidden></span>
    <button id="gearbtn" class="gear round-btn" title="panel theme">&#9881;&#xFE0E;</button>
  </div>
  <div id="pop-cowork" class="pop-cowork" hidden></div>
  <div id="pop-treats" class="pop-cowork"></div>
  <div id="theme-row" class="theme-row" hidden>
    <span class="lbl">theme:</span>
    <button data-theme="system">system</button>
    <button data-theme="dark">dark</button>
    <button data-theme="light">light</button>
  </div>
  <div id="art-row" class="theme-row" hidden>
    <span class="lbl">skin:</span>
    <button data-art="app">app</button>
    <button data-art="cli">cli</button>
  </div>
  <div id="voice-row" class="theme-row" hidden>
    <span class="lbl">voice:</span>
    <button data-voice="on">on</button>
    <button data-voice="off">off</button>
    <button id="voice-detail" title="also read the ask itself, not just the opener">+ask</button>
    <button id="voice-chirp" title="a little chirp when he finishes a turn">chirp</button>
    <button id="voice-test" title="hear it now">test</button>
  </div>
  <!-- one button per installed English voice, filled in once at startup
       (never re-rendered — see the skeleton note above) -->
  <div id="voice-pick" class="theme-row" hidden>
    <span class="lbl">who:</span>
  </div>
  <!-- each label+controls set is one inline group, so when the row wraps it
       breaks BETWEEN them rather than orphaning a "+" on its own line -->
  <div id="voice-tone" class="theme-row" hidden>
    <span class="tone-grp">
      <span class="lbl">pitch:</span>
      <button data-tone="pitch" data-step="-0.1">&minus;</button>
      <span class="lbl" id="pitch-readout">1.15</span>
      <button data-tone="pitch" data-step="0.1">+</button>
    </span>
    <span class="tone-grp">
      <span class="lbl">speed:</span>
      <button data-tone="rate" data-step="-0.1">&minus;</button>
      <span class="lbl" id="rate-readout">1.00</span>
      <button data-tone="rate" data-step="0.1">+</button>
    </span>
  </div>
  <!-- Active attention rules, one chip each. Rebuilt only when the rule set
       actually changes (see renderFilterRow) — never on a pipeline tick, per
       the static-skeleton rule. An `ignore` rule has no session row left to
       clear it from, so without this the hide would be a one-way door. -->
  <div id="filter-row" class="theme-row" hidden>
    <span class="lbl">rules:</span>
  </div>
  <div id="pop-sessions"></div>
</div>
<div id="bubble" hidden></div>
<div id="petbtns" hidden>
  <div id="newbtn" class="round-btn" title="New Claude Code session">+</div>
  <div id="treatbtn" class="round-btn" title="Give Claw'd a treat">
    <svg viewBox="0 0 6 6" width="12" height="12" shape-rendering="crispEdges" aria-hidden="true" focusable="false">
      <path fill="currentColor" fill-rule="evenodd"
            d="M1 0h4v1h1v4h-1v1h-4v-1h-1v-4h1z M1 2h1v1h-1z M4 2h1v1h-1z M2 3h1v1h-1z"/>
    </svg>
  </div>
</div>

<div id="debug">
  <h1>Claw'dbot debug</h1>
  <div class="states" id="state-buttons"></div>
  <div class="row"><span>size: <span id="size-readout">1.00×</span></span>
    <span style="color:#888">(+ / − keys, 0 resets)</span></div>
  <label><input type="checkbox" id="bg-light"> light desk</label>
</div>

<script type="module">
  import { Pet } from './pet.js';
  import { STYLES } from './styles.js';
  import { TreatSprite, FALL_MS } from './treats.js';
  import * as voice from './voice.js';

  const IS_TAURI = !!window.__TAURI__;
  const invoke = IS_TAURI ? window.__TAURI__.core.invoke : null;

  // art style (app mascot / CLI mascot): persisted like the panel theme;
  // default app, so nothing changes for anyone who never touches the row
  let artStyle = 'app';
  try { artStyle = localStorage.getItem('artStyle') || 'app'; } catch {}
  if (!STYLES[artStyle]) artStyle = 'app';

  // the demo panel's state list follows the active style (soccer is app-only)
  let STATES = Object.keys(STYLES[artStyle].clips);

  // forgiveness halo (CSS px) around the sprite's envelope: part of the OS
  // hit region (reportBounds) AND of the buddy's own press region (onBuddy),
  // so a near-miss grab drags the buddy instead of merely focusing the
  // window; it also covers the buttons' invisible 8px hit rings
  const HALO = 20;

  // Canvas unit the overhead panels clear: above the TALLEST common frames so
  // they never cover the character (working's away frames top out at unit 52;
  // hop, wave and idle all stay lower). BOTH the popover and the speech bubble
  // hang off this one number so they can never drift apart.
  const SPRITE_CLEAR_UNIT = 52;

  let savedScale = 1.75;
  try { savedScale = parseFloat(localStorage.getItem('petScale')) || 1.75; } catch {}

  const canvas = document.getElementById('pet-canvas');
  const wrap = document.getElementById('pet-wrap');
  const pet = new Pet(canvas, IS_TAURI ? 1 : savedScale, artStyle);

  function reportBounds() {
    if (!IS_TAURI) return;
    // page-relative, not canvas-relative: the window is padded larger than
    // the canvas (so the webview's clipped edge falls on empty space), so
    // the wrap's offset must be folded into the hit-test bounds. While the
    // popover is open, the clickable rect is the union of buddy + panel.
    const b = pet.opaqueBounds();
    const r = wrap.getBoundingClientRect();
    let x = b.x + r.left, y = b.y + r.top;
    let right = x + b.w, bottom = y + b.h;
    if (!popEl.hidden) {
      const pr = popEl.getBoundingClientRect();
      x = Math.min(x, pr.left); y = Math.min(y, pr.top);
      right = Math.max(right, pr.right); bottom = Math.max(bottom, pr.bottom);
    }
    // the hover buttons are one row: its rect is the union of the pair, so
    // BOTH the "+" and the treat land inside the OS-level clickable region
    if (!btnsEl.hidden) {
      const br = btnsEl.getBoundingClientRect();
      x = Math.min(x, br.left); y = Math.min(y, br.top);
      right = Math.max(right, br.right); bottom = Math.max(bottom, br.bottom);
    }
    if (!bubEl.hidden) {
      // the bubble is clickable (jump-to-session) — it needs OS-level hits
      const ur = bubEl.getBoundingClientRect();
      x = Math.min(x, ur.left); y = Math.min(y, ur.top);
      right = Math.max(right, ur.right); bottom = Math.max(bottom, ur.bottom);
    }
    // the forgiveness halo keeps near-miss clicks on the window (and on the
    // buddy, see onBuddy) instead of letting them fall through to the desktop
    x -= HALO; y -= HALO; right += HALO; bottom += HALO;
    // report in PHYSICAL px: devicePixelRatio is the exact CSS->physical
    // factor including any webview zoom. Rust must NOT convert with the
    // monitor scale factor — zoom made them disagree (~10%), which shifted
    // the OS-level clickable region off the real controls (the tiny "+"
    // ended up entirely outside it while the big popover absorbed the error)
    const dpr = window.devicePixelRatio || 1;
    invoke('set_opaque_bounds', { x: x * dpr, y: y * dpr, w: (right - x) * dpr, h: (bottom - y) * dpr });
  }

  // --- hover buttons: the "+" (a new Claude Code session) and the treat
  //     show together by the buddy's feet while the cursor is over him (or
  //     over the pair itself) ---
  const btnsEl = document.getElementById('petbtns');
  const btnEl = document.getElementById('newbtn');
  const treatBtn = document.getElementById('treatbtn');
  let btnHideTimer = null;

  function showNewBtn() {
    clearTimeout(btnHideTimer);
    btnHideTimer = null;
    // the popover and the speech bubble both supersede them (the bubble
    // owns the below-the-buddy spot), and a meal in progress hides them
    if (!btnsEl.hidden || !popEl.hidden || !bubEl.hidden || feeding) return;
    const r = wrap.getBoundingClientRect();
    const rb = pet.restBounds();
    const feetCss = r.top + (rb.y + rb.h) * pet.scale;
    btnsEl.style.top = (feetCss + 6) + 'px';
    // peckish only ever shows up here, on a button the cursor already found
    treatBtn.classList.toggle('peckish', isPeckish());
    btnsEl.hidden = false;
    placeCenteredOnBuddy(btnsEl);
    reportBounds();
  }

  function scheduleHideNewBtn() {
    clearTimeout(btnHideTimer);
    // generous grace: an overshoot past the buttons and back must never
    // kill them mid-aim
    btnHideTimer = setTimeout(() => hideBtns(), 1200);
  }

  function hideBtns() {
    clearTimeout(btnHideTimer);
    btnHideTimer = null;
    if (btnsEl.hidden) return;
    btnsEl.hidden = true;
    reportBounds();
  }

  // Showing: genuine sprite hover. Hiding on the DESKTOP: only the Rust
  // pet-hover signal (cursor truly left the sprite+button+halo region) —
  // DOM-side timers raced the user while traveling down to the button.
  // The browser demo has no Rust poller, so it keeps DOM-based hiding.
  canvas.addEventListener('mousemove', (e) => {
    const rect = canvas.getBoundingClientRect();
    if (pet.hitTest(e.clientX - rect.left, e.clientY - rect.top)) showNewBtn();
    else if (!IS_TAURI) scheduleHideNewBtn();
  });
  canvas.addEventListener('mouseleave', () => { if (!IS_TAURI) scheduleHideNewBtn(); });
  btnsEl.addEventListener('mouseenter', () => { clearTimeout(btnHideTimer); btnHideTimer = null; });
  btnsEl.addEventListener('mouseleave', () => { if (!IS_TAURI) scheduleHideNewBtn(); });
  btnEl.addEventListener('click', () => {
    if (IS_TAURI) invoke('open_new_code_session');
    // visible confirmation: a terracotta pulse, then the pair retires
    // (no wave — the user prefers the pet not to react to new sessions)
    btnEl.classList.add('clicked');
    setTimeout(() => {
      btnEl.classList.remove('clicked');
      hideBtns();
    }, 600);
  });
  treatBtn.addEventListener('click', () => feed());

  // --- session popover: click the buddy to toggle a live list of every
  //     Claude session the pipeline knows about ---
  const popEl = document.getElementById('popover');
  let lastPipelineAt = 0; // when lastPipeline was received (ages drift live)

  // --- panel theme: system / dark / light for the popover + bubble.
  //     The gear and theme row are STATIC elements (see the HTML skeleton):
  //     rebuilding them on refresh dropped hover state and ate clicks. ---
  const popCount = document.getElementById('pop-count');
  const popBlind = document.getElementById('pop-blind');
  const popCowork = document.getElementById('pop-cowork');
  const popSessions = document.getElementById('pop-sessions');
  const themeRow = document.getElementById('theme-row');
  const artRow = document.getElementById('art-row');
  const voiceRow = document.getElementById('voice-row');
  const gearBtn = document.getElementById('gearbtn');
  const filterRow = document.getElementById('filter-row');

  let panelTheme = 'system';
  try { panelTheme = localStorage.getItem('panelTheme') || 'system'; } catch {}
  const darkQuery = window.matchMedia('(prefers-color-scheme: dark)');
  function applyPanelTheme() {
    const light = panelTheme === 'light' || (panelTheme === 'system' && !darkQuery.matches);
    document.body.classList.toggle('panels-light', light);
  }
  function syncThemeButtons() {
    themeRow.querySelectorAll('button[data-theme]').forEach((b) => {
      b.classList.toggle('active', panelTheme === b.dataset.theme);
    });
  }
  function setPanelTheme(t) {
    panelTheme = t;
    try { localStorage.setItem('panelTheme', t); } catch {}
    applyPanelTheme();
    syncThemeButtons();
  }
  darkQuery.addEventListener('change', () => { if (panelTheme === 'system') applyPanelTheme(); });
  applyPanelTheme();
  syncThemeButtons();
  // the gear shows/hides the settings rows together (theme + art)
  gearBtn.onclick = (e) => {
    e.stopPropagation();
    const show = themeRow.hidden;
    themeRow.hidden = !show;
    artRow.hidden = !show;
    voiceRow.hidden = !show;
    voicePickRow.hidden = !show;
    toneRow.hidden = !show;
    renderFilterRow(true); // owns its own visibility (gear open + rules exist)
    reportBounds();
  };
  themeRow.querySelectorAll('button[data-theme]').forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); setPanelTheme(b.dataset.theme); };
  });

  // --- art style row: swaps the buddy's whole clip set in place; the hit
  //     region and the demo state list follow the new style ---
  function syncArtButtons() {
    artRow.querySelectorAll('button[data-art]').forEach((b) => {
      b.classList.toggle('active', artStyle === b.dataset.art);
    });
  }
  function setArtStyle(name) {
    if (!STYLES[name]) return;
    artStyle = name;
    try { localStorage.setItem('artStyle', name); } catch {}
    pet.setStyle(name);
    syncArtButtons();
    STATES = Object.keys(pet.style.clips);
    buildStateButtons();
    reportBounds();
  }
  syncArtButtons();
  artRow.querySelectorAll('button[data-art]').forEach((b) => {
    b.onclick = (e) => { e.stopPropagation(); setArtStyle(b.dataset.art); };
  });

  // --- voice row: he says the ask out loud on needs_input and error ---
  const voiceDetailBtn = document.getElementById('voice-detail');
  const voiceChirpBtn = document.getElementById('voice-chirp');
  function syncVoiceButtons() {
    const v = voice.get();
    voiceRow.querySelectorAll('button[data-voice]').forEach((b) => {
      b.classList.toggle('active', (b.dataset.voice === 'on') === !!v.enabled);
    });
    voiceDetailBtn.classList.toggle('active', !!v.speakDetail);
    voiceChirpBtn.classList.toggle('active', !!v.chirp);
  }
  syncVoiceButtons();
  voiceRow.querySelectorAll('button[data-voice]').forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      const on = b.dataset.voice === 'on';
      voice.set({ enabled: on });
      if (on) voice.warm(); else voice.stop(); // pay the load cost here, not on the first real alert
      syncVoiceButtons();
    };
  });
  voiceDetailBtn.onclick = (e) => {
    e.stopPropagation();
    voice.set({ speakDetail: !voice.get().speakDetail });
    syncVoiceButtons();
  };
  voiceChirpBtn.onclick = (e) => {
    e.stopPropagation();
    const on = !voice.get().chirp;
    voice.set({ chirp: on });
    syncVoiceButtons();
    if (on) voice.chirp(3, 'up'); // hear what you just switched on
  };
  // the Test button forces the greeting on: you are listening for the whole
  // shape, not rolling the dice on whether he says hello this time
  function sampleLine() {
    const top = lastPipeline ? topSession(lastPipeline) : null;
    return voice.lineFor('needs_input', 'elicitation', top ? rowName(top) : 'Claw’d',
      'This is what I sound like when Claude needs you.', true);
  }
  document.getElementById('voice-test').onclick = (e) => {
    e.stopPropagation();
    voice.say(sampleLine());
  };

  // --- voice picker: one button per installed English voice. Clicking one
  //     selects it AND speaks a sample, so you choose by ear rather than by
  //     name. Built ONCE, when the voice list first arrives (it loads async
  //     in Chromium), never re-rendered — a rebuilt button under a still
  //     cursor loses hover and eats the next click.
  const voicePickRow = document.getElementById('voice-pick');
  let voicePickBuilt = false;
  // "Microsoft David - English (United States)" -> "David"
  const shortVoiceName = (n) => n.replace(/^Microsoft\s+/i, '').replace(/\s*[-–(].*$/, '').trim() || n;
  function syncVoicePick() {
    const want = voice.get().voiceName;
    voicePickRow.querySelectorAll('button[data-voice-name]').forEach((b) => {
      b.classList.toggle('active', b.dataset.voiceName === want);
    });
  }
  function buildVoicePick() {
    const list = voice.systemBackend.voices();
    if (voicePickBuilt || !list.length) return;
    voicePickBuilt = true;
    list.slice(0, 8).forEach((v) => {
      const b = document.createElement('button');
      b.dataset.voiceName = v.name;
      b.textContent = shortVoiceName(v.name);
      b.title = v.name;
      b.onclick = (e) => {
        e.stopPropagation();
        voice.set({ voiceName: v.name });
        syncVoicePick();
        voice.say(sampleLine()); // hear it the moment you pick it
      };
      voicePickRow.appendChild(b);
    });
    syncVoicePick();
    reportBounds(); // the panel just got a row taller
  }
  buildVoicePick();
  if (typeof speechSynthesis !== 'undefined') {
    speechSynthesis.addEventListener('voiceschanged', buildVoicePick);
  }

  // --- tone: pitch and speed, previewed on every press. The Windows voices
  //     are newsreader-flat; a small pitch lift is what makes him read as a
  //     small colleague rather than a narrator. Tuned by ear, which is why
  //     each press speaks. ---
  const toneRow = document.getElementById('voice-tone');
  const pitchReadout = document.getElementById('pitch-readout');
  const rateReadout = document.getElementById('rate-readout');
  function syncTone() {
    const v = voice.get();
    pitchReadout.textContent = Number(v.pitch).toFixed(2);
    rateReadout.textContent = Number(v.rate).toFixed(2);
  }
  syncTone();
  toneRow.querySelectorAll('button[data-tone]').forEach((b) => {
    b.onclick = (e) => {
      e.stopPropagation();
      voice.nudge(b.dataset.tone, parseFloat(b.dataset.step));
      syncTone();
      voice.say(sampleLine()); // speak() cancels the previous one, so rapid
                               // presses feel responsive instead of queueing
    };
  });

  // --- session filtering: which projects he is allowed to care about.
  //     The rule table lives in Rust (it is the reducer that applies it);
  //     these are just its mirror and its editor. Keyed on the row's
  //     displayed name, which is exactly what state::row_key matches on. ---
  const FILTER_NEXT = { '': 'quiet', quiet: 'ignore', ignore: '' };
  const FILTER_DOES = {
    '': 'mute — keep listing it, but he stops reacting to it',
    quiet: 'hide — drop it entirely; undo from the gear',
    ignore: 'show it again',
  };

  function currentFilters() {
    return (lastPipeline && lastPipeline.filters) || {};
  }
  // case-insensitive, matching the Rust side's eq_ignore_ascii_case
  function filterOf(name) {
    const f = currentFilters();
    const hit = Object.keys(f).find((k) => k.toLowerCase() === String(name).toLowerCase());
    return hit ? f[hit] : '';
  }

  // The primary control. A mute is about THIS chat: it lives in the pet's
  // memory only, dies when the session leaves the registry, and does not
  // follow a chat that changed hands and had its context cleared (that is a
  // new session id). `setFilter` below is the other, longer-lived rule type.
  function setSessionMute(id, mode) {
    if (!id) return;
    if (IS_TAURI) invoke('set_session_mute', { id, mode });
    if (lastPipeline) {
      let rows = lastPipeline.sessions.map((s) => (s.id === id ? { ...s, filtered: mode === 'quiet' ? 'quiet' : '' } : s));
      if (mode === 'ignore') rows = rows.filter((s) => s.id !== id);
      lastPipeline = { ...lastPipeline, sessions: rows, n_sessions: rows.length };
    }
    renderPopover();
    reportBounds();
  }

  function setFilter(name, mode) {
    if (!name) return;
    if (IS_TAURI) invoke('set_session_filter', { name, mode });
    // Optimistic: the reducer republishes within a tick, but a hidden row
    // must disappear on the click that hid it, not a second later.
    if (lastPipeline) {
      const f = { ...currentFilters() };
      Object.keys(f).forEach((k) => { if (k.toLowerCase() === name.toLowerCase()) delete f[k]; });
      if (mode) f[name] = mode;
      lastPipeline = { ...lastPipeline, filters: f };
      if (mode === 'ignore') {
        const kept = lastPipeline.sessions.filter((s) => rowName(s).toLowerCase() !== name.toLowerCase());
        lastPipeline = { ...lastPipeline, sessions: kept, n_sessions: kept.length };
      }
    }
    renderPopover();
    renderFilterRow(true);
    reportBounds(); // the panel just changed height
  }

  // Rebuilt only when the rule set actually changed: a rebuild under a
  // motionless cursor loses hover and can swallow the next click.
  let filterRowSig = null;
  function renderFilterRow(force) {
    const f = currentFilters();
    const names = Object.keys(f).sort();
    const sig = names.map((n) => n + '=' + f[n]).join('\u0000');
    if (!force && sig === filterRowSig) return;
    filterRowSig = sig;
    // the label is the skeleton; only the chips after it are rebuilt
    filterRow.querySelectorAll('.frule').forEach((el) => el.remove());
    for (const n of names) {
      const b = document.createElement('button');
      b.className = 'frule';
      b.title = 'stop ' + (f[n] === 'ignore' ? 'hiding' : 'muting') + ' ' + n;
      const lbl = document.createElement('span');
      lbl.textContent = (f[n] === 'ignore' ? 'hidden: ' : 'muted: ') + n;
      const x = document.createElement('span');
      x.className = 'x';
      x.textContent = '\u00d7';
      b.append(lbl, x);
      b.onclick = (e) => { e.stopPropagation(); setFilter(n, ''); };
      filterRow.appendChild(b);
    }
    // visible exactly when the gear panel is open and there is something to
    // show: muting a row with the panel already open reveals the chip on
    // that click, and clearing the last rule collapses the row again
    filterRow.hidden = !names.length || themeRow.hidden;
  }

  const POP_RANK = { needs_input: 6, error: 5, working: 3, thinking: 3, done: 2, idle: 1 };
  const POP_COLOR = {
    needs_input: '#e89478', error: '#7d7d92', working: '#c1694f',
    thinking: '#c9a15f', done: '#9ab98f', idle: '#8a8a8a',
  };

  function fmtAge(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    if (s < 60) return s + 's';
    const m = Math.floor(s / 60);
    if (m < 60) return m + 'm';
    return Math.floor(m / 60) + 'h' + (m % 60) + 'm';
  }

  // last path segment; recovered sessions carry a mangled slug with no
  // slashes, where the tail after the final dash is the project name
  function projName(cwd) {
    const parts = (cwd || '').split(/[\\/]/).filter(Boolean);
    let last = parts[parts.length - 1] || '';
    if (parts.length <= 1 && last.includes('-')) last = last.split('-').pop();
    return last || '(unknown)';
  }

  function renderPopover() {
    if (popEl.hidden) return;
    const p = lastPipeline;
    const drift = lastPipelineAt ? Date.now() - lastPipelineAt : 0;
    popSessions.textContent = '';
    // quiet standing line; a static node, so it never loses a click
    popTreats.textContent = treatLine();
    if (!p) {
      popCount.textContent = IS_TAURI ? 'waiting for session data…' : 'browser demo — no pipeline';
      popBlind.hidden = true;
      popCowork.hidden = true;
      return;
    }
    const n = p.sessions.length;
    popCount.textContent = n + (n === 1 ? ' session' : ' sessions');
    popBlind.hidden = !p.blind;
    if (p.blind) popBlind.textContent = 'blind: ' + p.detail;
    popCowork.hidden = !p.cowork_health;
    if (p.cowork_health) popCowork.textContent = 'cowork: ' + p.cowork_health;
    if (!n) {
      const e = document.createElement('div');
      e.className = 'empty';
      e.textContent = 'no active sessions';
      popSessions.appendChild(e);
      return;
    }
    const rows = [...p.sessions].sort((a, b) =>
      (POP_RANK[b.state] || 0) - (POP_RANK[a.state] || 0) || a.since_ms - b.since_ms);
    for (const s of rows) {
      const row = document.createElement('div');
      row.className = 'sess' + (s.filtered === 'quiet' ? ' quiet' : '');
      row.title = 'open this session in the Claude app';
      row.onclick = () => openLink(sessionLink(s));
      const top = document.createElement('div');
      top.className = 'top';
      const dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.background = POP_COLOR[s.state] || '#8a8a8a';
      const proj = document.createElement('span');
      proj.className = 'proj';
      proj.textContent = rowName(s);
      proj.title = s.cwd || s.title || s.id;
      const st = document.createElement('span');
      st.className = 'st';
      st.textContent = s.state.replace('_', ' ') + (s.busy && s.tools && s.tools.length ? ' · ' + s.tools[0] : '');
      const age = document.createElement('span');
      age.className = 'age';
      age.dataset.since = s.since_ms;
      age.textContent = fmtAge(s.since_ms + drift);
      top.append(dot, proj);
      if (s.surface === 'cowork') {
        const pill = document.createElement('span');
        pill.className = 'surface';
        pill.textContent = 'Cowork';
        top.appendChild(pill);
      }
      top.append(st, age);
      // the attention control: cycles care -> quiet -> hidden. It must not
      // also open the session, hence the stopPropagation.
      const mode = s.filtered || '';
      const fb = document.createElement('button');
      fb.className = 'fbtn';
      fb.textContent = mode === 'quiet' ? 'muted' : 'mute';
      // A project rule may be what muted this row. Clicking still works —
      // a chat-level mute outranks the rule, so this is how you single one
      // chat back out of a muted project — but say where the rule lives.
      const byRule = !!filterOf(rowName(s));
      fb.title = (FILTER_DOES[mode] || FILTER_DOES[''])
        + (byRule ? ' (this project also has a rule, under the gear)' : '');
      fb.onclick = (e) => { e.stopPropagation(); setSessionMute(s.id, FILTER_NEXT[mode] ?? 'quiet'); };
      top.appendChild(fb);
      row.appendChild(top);
      if (s.detail) {
        const d = document.createElement('div');
        d.className = 'detail';
        d.textContent = s.detail;
        d.title = s.detail;
        row.appendChild(d);
      }
      popSessions.appendChild(row);
    }
  }

  // ONE centering rule for every panel: sprite center is the reference,
  // widths are border-box, clamps are identical — the elements cannot drift
  // apart from each other or from the buddy.
  function placeCenteredOnBuddy(el, cssWidth) {
    if (cssWidth != null) el.style.width = cssWidth + 'px';
    const r = wrap.getBoundingClientRect();
    const rb = pet.restBounds();
    const center = r.left + (rb.x + rb.w / 2) * pet.scale;
    const box = el.getBoundingClientRect().width;
    el.style.left = Math.max(8, Math.min(center - box / 2, window.innerWidth - box - 8)) + 'px';
  }

  // The CSS `bottom` that parks a panel just above the buddy's clear line.
  // Bottom-anchored so the panel grows UPWARD into the window's reserved
  // headroom instead of pushing down over him.
  function aboveBuddyBottomCss(gap) {
    const r = wrap.getBoundingClientRect();
    const clearTopCss = r.top + SPRITE_CLEAR_UNIT * pet.scale;
    return (window.innerHeight - clearTopCss + gap) + 'px';
  }

  function positionPopover() {
    placeCenteredOnBuddy(popEl, Math.min(260, window.innerWidth - 16));
    // Only the transient done-flag tip reaches above the clear line, and it
    // briefly slips behind the panel.
    popEl.style.bottom = aboveBuddyBottomCss(10);
  }

  function setPopover(open) {
    if (popEl.hidden === !open) return;
    popEl.hidden = !open;
    if (open) { positionPopover(); renderPopover(); btnsEl.hidden = true; }
    else { themeRow.hidden = true; artRow.hidden = true; voiceRow.hidden = true; voicePickRow.hidden = true; toneRow.hidden = true; filterRow.hidden = true; } // reopening always starts on the session list
    updateBubble();
    reportBounds();
  }
  // ages tick in place — never a full DOM rebuild, which could swallow a
  // click landing mid-press (e.g. on the gear)
  function updateAges() {
    if (popEl.hidden || !lastPipelineAt) return;
    const drift = Date.now() - lastPipelineAt;
    popEl.querySelectorAll('.age[data-since]').forEach((el) => {
      el.textContent = fmtAge(Number(el.dataset.since) + drift);
    });
  }
  setInterval(updateAges, 1000);
  window.addEventListener('blur', () => setPopover(false));

  // --- speech bubble: the ask, readable with zero clicks. Shows while the
  //     reduced state is needs_input or error; the popover supersedes it. ---
  const bubEl = document.getElementById('bubble');
  bubEl.addEventListener('click', () => openLink(bubEl.dataset.link));
  // a row's display name: the session title when the source knows one
  // (Cowork toasts carry it), else the project folder (a Cowork row's cwd
  // is its first granted folder name)
  // the session that names an alert: highest priority, oldest first — the
  // same sort the popover lists by, so the bubble and the voice always agree
  // A muted chat that needs input. Quiet means he does not wear its state and
  // does not speak its ask — but silence would make muting indistinguishable
  // from not noticing, so it still gets the smallest possible signal: a `?`
  // over his head and one rising chirp.
  function quietAsk(p) {
    if (!p || !p.sessions) return null;
    return p.sessions.find((s) => s.filtered === 'quiet' && s.state === 'needs_input') || null;
  }

  function topSession(p) {
    if (!p || !p.sessions || !p.sessions.length) return null;
    return [...p.sessions].sort((a, b) =>
      (POP_RANK[b.state] || 0) - (POP_RANK[a.state] || 0) || a.since_ms - b.since_ms)[0];
  }

  function rowName(s) {
    if (s.title) return s.title;
    if (s.cwd) return projName(s.cwd);
    return s.surface === 'cowork' ? 'Cowork session' : '(unknown)';
  }
  // jump-to-session deep links (read from the Claude app's own bundle,
  // app 1.46388.4, verified live 2026-09-05). Both surfaces go through the
  // app's claude.ai path handler, which has NO feature flag: a Cowork row
  // opens /cowork/<cse id>; a Claude Code row opens /epitaxy/<app session
  // id> — the app's own route for a local session (its crash-reporter
  // scope records the main window at exactly that URL). The app id
  // (local_<uuid>) comes from the desktop log (link_id); the CLI uuid the
  // hooks report is useless to the app. The claude://code/continue and
  // code/needs-input forms are gated by a server flag that flipped off
  // mid-session, so they are only the fallback when no app id is known.
  function sessionLink(s) {
    if (s.surface === 'cowork') {
      if (s.link_id) return 'claude://claude.ai/cowork/' + encodeURIComponent(s.link_id) + '?source=desktop_action';
      return 'claude://code/needs-input?source=desktop_action';
    }
    if (s.link_id) return 'claude://claude.ai/epitaxy/' + encodeURIComponent(s.link_id) + '?source=desktop_action';
    if (s.state === 'needs_input') return 'claude://code/needs-input?source=desktop_action';
    return 'claude://code/continue?session=last&source=desktop_action';
  }
  function openLink(url) {
    if (IS_TAURI && url) invoke('open_claude_link', { url });
  }

  const KIND_TEXT = {
    permission: 'needs permission',
    idle_prompt: 'is waiting on you',
    agent_needs_input: 'needs your input',
    elicitation_dialog: 'is asking a question',
    elicitation: 'is asking a question',
    unknown: 'wants something',
  };

  function updateBubble() {
    const p = lastPipeline;
    const loud = !!p && (p.state === 'needs_input' || p.state === 'error');
    // the loud ask wins the spot; the quiet one only gets it when he is not
    // already wearing a real alert
    const qa = loud ? null : quietAsk(p);
    const show = !!p && (loud || !!qa) && popEl.hidden;
    bubEl.hidden = !show;
    if (!show) return;
    btnsEl.hidden = true; // the bubble owns the spot below the buddy
    bubEl.classList.toggle('ask', !!qa);
    if (qa) {
      // deliberately just the mark: naming the project here would be the
      // notification she muted, reintroduced one size smaller
      bubEl.dataset.link = sessionLink(qa);
      bubEl.classList.remove('err');
      bubEl.textContent = '';
      const q = document.createElement('div');
      q.className = 'b-q';
      q.textContent = '?';
      q.title = rowName(qa) + ' is asking (muted)';
      bubEl.appendChild(q);
      const qt = document.createElement('div');
      qt.className = 'b-tail';
      bubEl.appendChild(qt);
      bubEl.style.top = 'auto';
      bubEl.style.bottom = aboveBuddyBottomCss(10);
      bubEl.style.maxWidth = '';
      placeCenteredOnBuddy(bubEl);
      return;
    }
    const top = topSession(p);
    bubEl.dataset.link = top ? sessionLink(top) : '';
    bubEl.classList.toggle('err', p.state === 'error');
    bubEl.textContent = '';
    const t = document.createElement('div');
    t.className = 'b-title';
    t.textContent = p.state === 'error'
      ? (top ? rowName(top) + ' hit an error' : 'something went wrong')
      : (top ? rowName(top) + ' ' + (KIND_TEXT[p.kind] || KIND_TEXT.unknown) : 'Claude ' + (KIND_TEXT[p.kind] || KIND_TEXT.unknown));
    bubEl.appendChild(t);
    if (p.detail) {
      const d = document.createElement('div');
      d.className = 'b-detail';
      d.textContent = p.detail;
      bubEl.appendChild(d);
    }
    const tail = document.createElement('div');
    tail.className = 'b-tail';
    bubEl.appendChild(tail);
    // Centered ABOVE the buddy, tail pointing down at his head; the bubble
    // hugs its text up to maxWidth. Overhead rather than under his feet
    // because he is usually parked at the bottom of the screen (often right
    // on the taskbar), where a bubble hanging below him is cut off. Anchored
    // by its BOTTOM edge, so a long ask grows upward into the same reserved
    // headroom the popover uses instead of creeping down over him.
    bubEl.style.top = 'auto';
    bubEl.style.bottom = aboveBuddyBottomCss(10);
    bubEl.style.maxWidth = Math.min(320, window.innerWidth - 16) + 'px';
    placeCenteredOnBuddy(bubEl);
  }

  pet.on('scale', (s) => {
    wrap.style.width = (160 * s) + 'px';
    wrap.style.height = (160 * s) + 'px';
    document.getElementById('size-readout').textContent = s.toFixed(2) + '×';
    try { localStorage.setItem('petScale', String(s)); } catch {}
  });

  // --- debug panel ---
  const btns = document.getElementById('state-buttons');
  function buildStateButtons() {
    btns.textContent = '';
    STATES.forEach((s) => {
      const b = document.createElement('button');
      b.textContent = s.replace('_', ' ');
      b.dataset.state = s;
      b.onclick = () => setState(s);
      b.classList.toggle('active', s === pet.state);
      btns.appendChild(b);
    });
  }
  buildStateButtons();

  function setState(s) {
    pet.setState(s);
  }
  // the active chip follows the pet's actual state, so self-driven changes
  // (auto-sleep, auto-wake) stay visible in the panel too
  pet.on('state', ({ state }) => {
    [...btns.children].forEach((b) => b.classList.toggle('active', b.dataset.state === state));
  });

  document.getElementById('bg-light').onchange = (e) => {
    document.body.classList.toggle('demo-light', e.target.checked);
    document.body.classList.toggle('demo-dark', !e.target.checked);
  };

  // --- resize: + / − keys while the pet window is focused (click it first);
  //     0 resets to the default size ---
  const DEFAULT_SCALE = 1.75;
  function resizeTo(next) {
    pet.setScale(next);
    if (IS_TAURI) {
      invoke('set_pet_scale', { scale: pet.scale });
      reportBounds();
    }
  }

  // --- keyboard: +/−/0 resize everywhere; q quits the desktop pet (by
  //     design). Number-key state forcing, d (debug panel) and r (reload)
  //     are BROWSER-DEMO ONLY: on the real pet the pipeline owns the state,
  //     and a stray keypress after a click must not fake it or reload. ---
  document.addEventListener('keydown', (e) => {
    const n = parseInt(e.key, 10);
    if (e.key === '0') resizeTo(DEFAULT_SCALE);
    else if (!IS_TAURI && n >= 1 && n <= STATES.length) setState(STATES[n - 1]);
    else if (e.key === '+' || e.key === '=') resizeTo(pet.scale * 1.15);
    else if (e.key === '-' || e.key === '_') resizeTo(pet.scale / 1.15);
    else if (e.key === 'd' && !IS_TAURI) {
      const dbg = document.getElementById('debug');
      dbg.style.display = dbg.style.display === 'grid' ? 'none' : 'grid';
    } else if (e.key === 'r' && !IS_TAURI) location.reload();
    else if (e.key === 'q' && IS_TAURI) invoke('quit_app');
    else if (e.key === 'Escape') setPopover(false);
  });

  // --- waking: any grab of the buddy (click or the start of a drag) ends a
  //     nap early; registered before the drag block so it never depends on it ---
  // The OS-level hit region is the sprite's envelope plus the HALO (see
  // reportBounds), so a press anywhere in that ring reaches this window and
  // must belong to the buddy — with canvas-only listeners a near-miss grab
  // merely focused the window and did nothing. Panels sit inside the same
  // ring and keep their own clicks.
  function onBuddy(e) {
    if (e.target && e.target.closest && e.target.closest('#popover, #bubble, #petbtns, #debug')) return false;
    const rect = canvas.getBoundingClientRect();
    const b = pet.opaqueBounds();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    return x >= b.x - HALO && x < b.x + b.w + HALO && y >= b.y - HALO && y < b.y + b.h + HALO;
  }

  document.addEventListener('pointerdown', (e) => {
    if (pet.state === 'sleeping' && onBuddy(e)) setState('idle');
  });

  // --- drag: press + >2px movement drags the window; a plain click toggles
  //     the session popover. The window is moved by Rust (set_position from
  //     its poller thread), NOT by the OS move loop: tao gives even this
  //     undecorated window WS_CAPTION, so Windows treated the invisible
  //     popover headroom as a title bar and popped the window down on
  //     mouse-up whenever that empty air sat above the screen top — the buddy
  //     landed somewhere other than where it was released. Pointer capture
  //     (on the body: the press region is wider than the canvas) keeps every
  //     move/up flowing even when the cursor outruns the window, so the
  //     press state can never go stale. ---
  if (IS_TAURI) {
    let down = null, dragging = false;
    const clear = () => { down = null; dragging = false; };
    const endDrag = () => { if (dragging) invoke('end_drag'); clear(); };
    document.addEventListener('pointerdown', (e) => {
      if (e.button !== 0 || !onBuddy(e)) return;
      down = { x: e.screenX, y: e.screenY };
      dragging = false;
      // capture is an optimisation (moves keep flowing when the cursor
      // outruns the window), not a precondition: a synthesised press with
      // no active button makes it throw, and the press must still count
      try { document.body.setPointerCapture(e.pointerId); } catch {}
    });
    document.addEventListener('pointermove', (e) => {
      if (!down || dragging) return;
      if (!(e.buttons & 1)) { clear(); return; } // released while out of view
      if (Math.hypot(e.screenX - down.x, e.screenY - down.y) > 2) {
        dragging = true;
        // Rust anchors the grab at the PRESS point (physical px) and follows
        // the cursor from there, so the movement before this IPC lands is
        // never lost and the buddy stays exactly under the grabbed pixel
        const dpr = window.devicePixelRatio || 1;
        invoke('start_drag', { x: down.x * dpr, y: down.y * dpr });
      }
    });
    document.addEventListener('pointerup', (e) => {
      if (e.button !== 0) return;
      // a press that never turned into a drag is a plain click: the popover
      if (down && !dragging) setPopover(popEl.hidden);
      endDrag();
    });
    document.addEventListener('pointercancel', endDrag);
    document.addEventListener('lostpointercapture', endDrag);
    window.addEventListener('blur', endDrag);
  } else {
    // browser demo: plain click toggles the popover too (layout testing)
    document.addEventListener('click', (e) => { if (onBuddy(e)) setPopover(popEl.hidden); });
  }

  // --- pipeline truth (Tauri): the last state received from the Rust
  //     reducer. The greeting and any local flourish always return here. ---
  let lastPipeline = null;
  // Nothing is spoken until the boot wave has handed off: a pet that
  // announces itself at every launch gets muted by week two, and the very
  // first payload would otherwise always look like a fresh transition.
  let voiceArmed = false;

  // Speak only on a genuine transition INTO an alert state. Compared on the
  // (state, kind) PAIR, because consecutive payloads can share a state while
  // the kind changes (idle_prompt -> permission on the same session).
  // This comparison is also what makes the meal safe: endMeal() re-applies
  // the unchanged lastPipeline, which is not a transition, so he doesn't
  // re-announce the same ask after every treat.
  // when the reduced state last actually changed — used to tell a long job
  // from a two-second reply when he finishes
  let stateSince = Date.now();

  function maybeSpeak(prev, p) {
    if (!p) return;
    const changed = !prev || prev.state !== p.state;
    const heldMs = changed ? Date.now() - stateSince : 0;
    if (changed) stateSince = Date.now();
    if (!voiceArmed) return;
    const top = topSession(p);
    const name = top ? rowName(top) : '';

    if (p.state === 'needs_input' || p.state === 'error') {
      if (prev && prev.state === p.state && prev.kind === p.kind) return;
      voice.alert({ state: p.state, kind: p.kind, name, detail: p.detail });
      return;
    }
    // a muted chat started asking: the question sound, nothing else. Compared
    // on the session id so a second muted chat asking is its own event, while
    // the same one still asking is not.
    const qa = quietAsk(p);
    const qaWas = quietAsk(prev);
    if (qa && (!qaWas || qaWas.id !== qa.id)) voice.asked();
    // finishing a turn: a chirp, or a sentence if the job actually took a
    // while. Only when he was genuinely busy first — a done arriving from
    // idle is bookkeeping, not an accomplishment.
    if (p.state === 'done' && changed && prev &&
        (prev.state === 'working' || prev.state === 'thinking')) {
      voice.finished({ name, busyMs: heldMs });
    }
  }
  function recordPipeline(p) {
    const prev = lastPipeline; // captured before the overwrite: the only
    // record of what he was doing a moment ago
    lastPipeline = p;
    lastPipelineAt = Date.now();
    maybeSpeak(prev, p);
    // rules can change from outside this window (a hand-edited config.json),
    // so the chips follow the payload, not only local clicks
    renderFilterRow();
    renderPopover(); // no-op while hidden
    updateBubble();
    // the bubble/popover just changed shape: without this the OS hit region
    // kept the LAST reported rect and a fresh needs-input bubble was
    // click-through until the cursor had crossed the sprite and 1.2s passed
    reportBounds();
  }
  function applyPipeline(p) {
    if (!p) return;
    recordPipeline(p);
    // guard: a reducer bug or version skew must never crash the render loop
    try { setState(p.state, p.detail); } catch (err) { console.error('bad pet-state', p, err); }
  }

  // --- treats: the second round button feeds him. The treat falls in at
  //     his side, he plays the LOCAL `eating` clip (the reducer never emits
  //     it), and the host hands him back to pipeline truth when the meal is
  //     over — the same handoff the boot wave uses. ---
  const popTreats = document.getElementById('pop-treats');
  const treatLayer = new TreatSprite(pet, wrap);
  // the body bobs for exactly as long as he is making a noise, so the voice
  // reads as coming from HIM rather than from the machine
  voice.onSpeaking((on, kind) => {
    pet.setSpeaking(on);
    pet.setSquint(on && kind === 'chirp'); // the chirp gets a scrunch, words don't
  });

  const PECKISH_MS = 3 * 60 * 60 * 1000; // a few hours make him peckish
  const BITE_MS = 333;      // into the eating clip: where the first munch lands
  const MEAL_MS = 1334;     // intro (800) + one loop cycle (534)
  const STRANDED_MS = 3000; // grace before a meal that never started gives up

  let feeding = false;

  // localStorage wrapped like every other read here; a cleared or garbled
  // store reads as zero treats, never NaN
  let treats = { count: 0, lastFedAt: 0 };
  try {
    const raw = localStorage.getItem('treats');
    if (raw) {
      const t = JSON.parse(raw) || {};
      treats = { count: Number(t.count) || 0, lastFedAt: Number(t.lastFedAt) || 0 };
    }
  } catch {}

  function treatLine() {
    if (!treats.count) return 'treats: 0';
    return 'treats: ' + treats.count
      + (treats.lastFedAt ? ' · last ' + fmtAge(Date.now() - treats.lastFedAt) + ' ago' : '');
  }
  // never fed counts as peckish: the pulse is the only hint the button feeds
  // him, and it is only ever seen on a button the cursor has already found
  function isPeckish() { return Date.now() - treats.lastFedAt > PECKISH_MS; }

  // an outro's real length, read from the clip table instead of guessed, so
  // both skins (and any retiming) stay in step
  function outroMs(name) {
    const c = pet.style.clips[name];
    return c && c.stages ? c.stages.outro.reduce((a, s) => a + s.ms, 0) : 0;
  }

  function feed() {
    if (feeding) return;
    feeding = true;
    // never drop a treat on a sleeping crab: wake him first and let the
    // whole rise / stretch / settle outro finish before the snack arrives
    const waking = pet.state === 'sleeping';
    if (waking) setState('idle');
    hideBtns();
    setTimeout(() => {
      treatLayer.drop();
      // the clip starts as the treat lands. If another clip's outro is still
      // running, pet.js holds the request and the biscuit simply waits on
      // the ground until he is free (the state listener below picks it up).
      setTimeout(() => setState('eating'), FALL_MS);
      setTimeout(() => {
        if (feeding && pet.state !== 'eating') { treatLayer.clear(); feeding = false; }
      }, FALL_MS + STRANDED_MS);
    }, waking ? outroMs('sleeping') : 0);
  }

  // The meal's beats hang off the clip actually STARTING, not off the
  // request: setState() may be holding it behind another clip's outro, and
  // the bite has to land on the bite.
  pet.on('state', ({ state }) => {
    if (state !== 'eating') return;
    setTimeout(() => {
      treatLayer.clear();                 // taken in one bite
      if (pet.state !== 'eating') return; // cut short: nothing was eaten
      voice.chirp(2, 'flat');             // a small happy noise, not a sentence
      treats = { count: treats.count + 1, lastFedAt: Date.now() };
      try { localStorage.setItem('treats', JSON.stringify(treats)); } catch {}
      treatBtn.classList.remove('peckish');
      renderPopover();                    // no-op while hidden
    }, BITE_MS);
    setTimeout(endMeal, MEAL_MS);
  });

  // Back to pipeline truth, exactly as the boot wave hands off. An attention
  // state that arrived mid-munch is already queued behind the clip's outro
  // (pet.js _outro.pending), so nothing here handles interruption itself.
  function endMeal() {
    feeding = false;
    if (pet.state !== 'eating') return; // something else took over
    if (!IS_TAURI) { setState('idle'); return; }
    if (lastPipeline) applyPipeline(lastPipeline);
    else setState('idle');
  }

  // greet the fresh app launch with a smiling wave, then settle into truth:
  // the reducer's state in Tauri (sleeping until events say otherwise), the
  // idle demo in the browser. 1875ms lands mid-way through the 4th cycle's
  // arm-DOWN frame (cycle 500ms, down half at 250-500), so with the clip's
  // arm-down outro the gesture always completes instead of cutting off.
  // (guard: skip the handoff if something else changed the state meanwhile)
  setState('wave');
  setTimeout(() => {
    // armed first, before any of the early returns below, so the voice comes
    // alive on every boot path. Re-applying the pending payload on the next
    // line is not a transition (prev is that same payload), so the handoff
    // itself stays silent.
    voiceArmed = true;
    if (pet.state !== 'wave') return;
    if (!IS_TAURI) { setState('idle'); return; }
    if (lastPipeline) applyPipeline(lastPipeline);
    else setState('sleeping'); // no events yet; the snapshot may still land
  }, 1875);

  // Tauri host wiring. The demo desk background is only ever added in browser
  // mode, so a script failure can never paint the transparent window opaque.
  if (IS_TAURI) {
    document.body.classList.add('tauri');
    // the bottom-anchored wrap only moves once the window resize lands in
    // the webview, so the hit region must be re-measured on resize (a +/−/0
    // step used to report bounds against the OLD viewport)
    window.addEventListener('resize', reportBounds);
    // Rust owns the scale (it restores it from config). Never derive scale
    // from the viewport: the webview's innerWidth under-reports the window
    // size by ~12px, and a viewport-derived scale ratchets downward forever.
    invoke('get_pet_scale').then((s) => {
      pet.setScale(s);
      reportBounds();
    });

    // Event pipeline: listener FIRST, then the snapshot, so a stale snapshot
    // can never overwrite a raced-in live event. During the boot wave,
    // arriving states are recorded but only attention states cut in.
    const { listen } = window.__TAURI__.event;
    // Rust's cursor poller is the hover ground truth: after the window
    // starts ignoring cursor events, DOM mouseleave can never fire, so the
    // "+" would stick around forever without this
    listen('pet-hover', (e) => {
      // entering the pet's vicinity summons the "+"; leaving it hides it
      // after the grace. No sprite-precision hover, no DOM timers to race.
      if (e.payload) showNewBtn();
      else scheduleHideNewBtn();
    });
    listen('pet-state', (e) => {
      const p = e.payload;
      if (pet.state === 'wave' && p.state !== 'needs_input' && p.state !== 'error') {
        recordPipeline(p); // the handoff will apply it
        return;
      }
      applyPipeline(p);
    }).then(() => invoke('get_pet_state'))
      .then((p) => {
        if (!p || lastPipeline) return; // a live event already superseded it
        if (pet.state === 'wave') recordPipeline(p);
        else applyPipeline(p);
      });
  } else {
    document.body.classList.add('demo-dark');
    pet._emit('scale', pet.scale); // sync wrap size + readout to restored scale
  }

  // debug/test handle
  // debug/test handle. applyPipeline is exposed so the browser demo can drive
  // a real reducer payload (bubble, popover, state) without a Rust host.
  window.__clawdbot = { pet, setState, setStyle: setArtStyle, setPopover, renderPopover, feed, treatLayer, applyPipeline, voice, get treats() { return treats; }, get lastPipeline() { return lastPipeline; } };
</script>
</body>
</html>
